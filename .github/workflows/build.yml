# Testes a cada envio; ao criar uma tag vX.Y.Z, também gera o DraftBot.exe e publica a release.
# A release fica no repositório privado: só você (e quem você convidar) vê e baixa.
name: Testes e executável

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Testes do programa
        run: python -m unittest discover -s tests -t . -v
      - name: Testes da página
        run: node tests/test_page.mjs
      - name: Versão e notas
        run: python tools/check_version.py

  windows:
    needs: testes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes do programa no Windows
        run: python -m unittest discover -s tests -t . -v

      - name: Endereço do aviso de nova versão (variável UPDATE_URL do repositório)
        if: ${{ vars.UPDATE_URL != '' }}
        run: Set-Content -Path update_url.txt -Value "${{ vars.UPDATE_URL }}" -NoNewline

      - name: Gerar o DraftBot.exe (Nuitka)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nuitka>=2.4,<3" zstandard
          $v = python tools/check_version.py
          $extra = @()
          if (Test-Path update_url.txt) { $extra += "--include-data-files=update_url.txt=update_url.txt" }
          # arquivo único; descompacta uma vez por versão em %LOCALAPPDATA%\DraftBot\programa\<versão>
          python -m nuitka draftbot.py --onefile --assume-yes-for-downloads --output-dir=build `
            --onefile-tempdir-spec="{CACHE_DIR}/DraftBot/programa/{VERSION}" `
            --output-filename=DraftBot.exe --windows-icon-from-ico=assets/draftbot.ico `
            --include-data-files=index.html=index.html --include-data-files=assets/draftbot.ico=assets/draftbot.ico @extra `
            --company-name=DraftBot --product-name=DraftBot --file-version=$v --product-version=$v `
            --file-description="DraftBot - assistente de selecao de campeoes" --windows-console-mode=attach
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Conferir se o .exe abre (autoteste)
        env:
          DRAFTBOT_DATA: ${{ runner.temp }}\draftbot-data
          DRAFTBOT_PORT: "8791"
        run: |
          New-Item -ItemType Directory -Force $env:DRAFTBOT_DATA | Out-Null
          # sem console próprio, o PowerShell não espera o .exe sozinho: Start-Process -Wait
          $p = Start-Process -FilePath .\build\DraftBot.exe -ArgumentList "--selftest" -Wait -PassThru -NoNewWindow
          $r = Get-Content -Raw -ErrorAction SilentlyContinue (Join-Path $env:DRAFTBOT_DATA "selftest.txt")
          Write-Output "saída: $($p.ExitCode) · $r"
          if ($p.ExitCode -ne 0 -or -not ($r -like "SELFTEST OK*executável*")) { exit 1 }

      - name: Testar a atualização automática com o .exe de verdade
        env:
          PYTHONUTF8: "1"
        run: python tools/e2e_update.py build\DraftBot.exe

      - name: Montar o pacote .zip
        run: |
          $v = python tools/check_version.py
          New-Item -ItemType Directory -Force pacote\DraftBot | Out-Null
          Copy-Item build\DraftBot.exe pacote\DraftBot\DraftBot.exe
          Copy-Item LEIA-ME-EXE.txt pacote\DraftBot\LEIA-ME.txt
          Compress-Archive -Path pacote\DraftBot -DestinationPath "DraftBot-v$v-windows.zip"
          "ZIP=DraftBot-v$v-windows.zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "VER=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: DraftBot-windows
          path: ${{ env.ZIP }}

      - name: Publicar a release (privada, junto com o repositório)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $env:PYTHONUTF8 = "1"
          $sha = (Get-FileHash $env:ZIP -Algorithm SHA256).Hash.ToLower()
          python tools/release_notes.py $env:VER | Out-File -Encoding utf8 notes.md
          $gist = python tools/gist_json.py $env:VER $sha | Out-String
          Add-Content -Encoding utf8 notes.md "`n---`n**Para publicar:** suba o .zip no Drive (qualquer pessoa com o link) e cole isto no ``version.json`` do gist, trocando o link:`n"
          Add-Content -Encoding utf8 notes.md ('```json' + "`n" + $gist.Trim() + "`n" + '```')
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $env:ZIP --clobber
            gh release edit $env:GITHUB_REF_NAME --title "DraftBot $env:VER" --notes-file notes.md
          } else {
            gh release create $env:GITHUB_REF_NAME $env:ZIP --title "DraftBot $env:VER" --notes-file notes.md
          }
          exit $LASTEXITCODE
