# Rode manualmente (aba Actions > "Avisar nova versão" > Run workflow) DEPOIS de colocar o .zip novo
# no link de download. Atualiza o version.json do gist secreto: quem tem o DraftBot vê o aviso.
#
# Precisa (uma vez, em Settings > Secrets and variables > Actions):
#   secret   GIST_TOKEN    token do GitHub com permissão "gist"
#   variável GIST_ID       o código do gist secreto (parte final do endereço do gist)
#   variável DOWNLOAD_URL  o link que você manda para os amigos (Google Drive / OneDrive)
name: Avisar nova versão

on:
  workflow_dispatch:

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar o version.json do gist secreto
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ vars.GIST_ID }}
          DOWNLOAD_URL: ${{ vars.DOWNLOAD_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$GIST_TOKEN" -a -n "$GIST_ID" -a -n "$DOWNLOAD_URL" || { echo "Configure GIST_TOKEN, GIST_ID e DOWNLOAD_URL"; exit 1; }
          v=$(python3 tools/check_version.py)
          gh release download "v$v" -p "*.zip" -D rel
          sha=$(sha256sum rel/*.zip | cut -d' ' -f1)
          python3 tools/gist_json.py "$v" "$sha" "$DOWNLOAD_URL" > version.json
          cat version.json
          python3 -c "import json;print(json.dumps({'files':{'version.json':{'content':open('version.json',encoding='utf-8').read()}}}))" > payload.json
          curl -fsS -X PATCH -H "Authorization: Bearer $GIST_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/gists/$GIST_ID" --data @payload.json > /dev/null
          echo "Aviso publicado."
